name: Build and Deploy
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true

      - name: Build
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Show wasm artifacts (debug)
        run: |
          echo "List release dir:"
          ls -la target/wasm32-unknown-unknown/release || true
          echo "Find any wasm files:"
          find target/wasm32-unknown-unknown/release -maxdepth 1 -name "*.wasm" -print || true

      - name: Install wasm-bindgen CLI
        run: cargo install -f wasm-bindgen-cli

      - name: Prepare Deployment Directory
        run: |
          mkdir -p ./deploy
          cp ./target/wasm32-unknown-unknown/release/Downbeat.wasm ./deploy/
          cp index.html ./deploy/
          cp mq_js_bundle.js ./deploy/

      - name: Copy site assets
        run: |
          # wasm-bindgen places wasm + glue JS into ./deploy
          cp -v index.html ./deploy/
          cp -v mq_js_bundle.js ./deploy/ || true

      - name: Show deploy directory (debug)
        run: ls -la ./deploy || true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy